<!DOCTYPE html>
<html lang="en" data-live="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Corte Palma — live street</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1210;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #credit {
      position: fixed;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      color: #f4ead8;
      font: 500 10px/1.3 system-ui, sans-serif;
      opacity: 0.72;
      pointer-events: none;
      text-shadow: 0 1px 2px #1a1210;
    }
    #fail {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      background: rgba(40, 8, 8, 0.92);
      color: #f4ead8;
      font: 600 16px/1.4 system-ui, sans-serif;
      padding: 24px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="fail"></div>
  <div id="credit">Sketchfab CC BY: Tesla Optimus — Mechamaner.V · Cybertruck — hashikemu · Tesla 2018 Model 3 — Ameer Studio</div>
  <script>window.STREET_LIVE = true;</script>
  <script src="/street/vendor/three.min.js"></script>
  <script src="/street/vendor/GLTFLoader.js"></script>
  <script src="/street/street.js"></script>
</body>
</html>
